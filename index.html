    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fffdf7; color: #171717; font-family: "Noto Sans SC", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #fffdf7; text-align: center; }
    #loading[hidden], [hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(20px, 5vw, 32px); overflow-wrap: anywhere; }
    p { margin: 0; }
    progress { width: min(320px, 75vw); justify-self: center; }
    button { justify-self: center; padding: 12px 24px; cursor: pointer; font: inherit; }

  <style id="loading-art">
    html, body { background: #fffdf7; color: #171717; }
    #loading { isolation: isolate; box-sizing: border-box; overflow: auto; place-content: end center; gap: 12px; padding-bottom: max(40px, env(safe-area-inset-bottom)); background: #fffdf7; }
    #loading::before { content: ""; position: fixed; inset: 0; z-index: -2; background: none; pointer-events: none; }
    #loading::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(0deg, #fffdf7 0%, #fffdf7ee 16%, #fffdf7b3 35%, transparent 75%); pointer-events: none; }
    #loading > * { max-width: min(560px, 100%); justify-self: center; }
    #loading h1 { font-weight: 700; font-size: clamp(24px, 4vw, 42px); line-height: 1.12; text-shadow: 0 2px 14px #fffdf7; }
    #loading-status { font-weight: 500; }
    #loading progress { display: block; width: min(320px, 75vw); height: 7px; border: 0; border-radius: 20px; overflow: hidden; accent-color: #ffcf35; background: #17171726; }
    #loading progress::-webkit-progress-bar { background: #17171726; border-radius: 20px; }
    #loading progress::-webkit-progress-value { background: #ffcf35; border-radius: 20px; }
    #loading progress::-moz-progress-bar { background: #ffcf35; border-radius: 20px; }
    #loading button { min-height: 44px; border: 1px solid #ffcf35; border-radius: 10px; background: #ffcf35; color: #171717; }
    #loading button:focus-visible { outline: 3px solid #ffcf35; outline-offset: 4px; }
    #loading [hidden] { display: none; }
    @media (max-aspect-ratio: 1/1) { #loading::before { background-size: 100% auto; } #loading::after { background: linear-gradient(180deg, transparent 25%, #fffdf7 100%) center top / 100% calc(100vw * 2 / 3) no-repeat; } #loading { place-content: center; padding-top: calc(100vw * 2 / 3); padding-bottom: max(24px, env(safe-area-inset-bottom)); } }
    @media (max-height: 480px) and (min-aspect-ratio: 1/1) { #loading { place-content: center end; padding: 16px 24px; } #loading > * { max-width: 44vw; } #loading h1 { font-size: clamp(20px, 4vw, 30px); } #loading::before { background-size: auto 100%; background-position: left center; } #loading::after { background: linear-gradient(90deg, transparent 0%, #fffdf799 40%, #fffdf7 65%); } #loading progress { width: min(260px, 40vw); } }

<body>

  <section id="loading" role="status" aria-label="Game loading">

      </div>
      <div id="loading-ui">

      const progress = document.getElementById('loading-progress');
      const progressWrap = document.getElementById('loading-progress-wrap');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');

      document.documentElement.lang = 'en';

      let ready = false;
